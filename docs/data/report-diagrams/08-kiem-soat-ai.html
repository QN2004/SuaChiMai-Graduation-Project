<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Năm lớp kiểm soát chống bịa</title><style>body{margin:0;background:white}.diagram-container{overflow-x:auto}svg{display:block;width:1344px;min-width:1344px}</style></head><body><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 756" width="1344" height="756" role="img" aria-labelledby="08-kiem-soat-ai-title 08-kiem-soat-ai-desc"><title id="08-kiem-soat-ai-title">Năm lớp kiểm soát chống bịa</title><desc id="08-kiem-soat-ai-desc">Năm lớp kiểm soát chống bịa của hệ thống Sữa Chi Mai.</desc><defs><marker id="08-kiem-soat-ai-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64737d"/></marker></defs><rect width="1344" height="756" fill="#fff"/><path d="M 296 278 L 376 278" fill="none" stroke="#64737d" stroke-width="2"  marker-end="url(#08-kiem-soat-ai-arrow)"/><path d="M 632 278 L 712 278" fill="none" stroke="#64737d" stroke-width="2"  marker-end="url(#08-kiem-soat-ai-arrow)"/><path d="M 968 278 L 1048 278" fill="none" stroke="#64737d" stroke-width="2"  marker-end="url(#08-kiem-soat-ai-arrow)"/><rect x="40" y="168" width="256" height="220" rx="8" fill="#ffffff" stroke="#64737d" stroke-width="2"/><text x="168" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">1. Giới hạn nguồn</text><text x="168" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Chỉ dùng JSON từ</text><text x="168" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">GET /api/products</text><text x="168" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Không tự tạo sản phẩm</text><rect x="376" y="168" width="256" height="220" rx="8" fill="#ffffff" stroke="#64737d" stroke-width="2"/><text x="504" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">2. Chỉ trả mã</text><text x="504" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">[[PRODUCT_IDS: …]]</text><text x="504" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Nội dung không tự đặt giá</text><text x="504" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Ứng viên có trong JSON</text><rect x="712" y="168" width="256" height="220" rx="8" fill="#fff0f5" stroke="#d03169" stroke-width="2"/><text x="840" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">3. Kiểm tra lại mã</text><text x="840" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Mã nguyên, bỏ trùng</text><text x="840" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Đối chiếu trạng thái bán</text><text x="840" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Và tồn kho khả dụng</text><rect x="1048" y="168" width="256" height="220" rx="8" fill="#ffffff" stroke="#64737d" stroke-width="2"/><text x="1176" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">4. Dựng thẻ từ CSDL</text><text x="1176" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Tên, giá, tồn, ảnh</text><text x="1176" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Đọc lại từ MySQL</text><text x="1176" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Loại thông tin đã cũ</text><rect x="40" y="536" width="1264" height="164" rx="8" fill="#ffffff" stroke="#64737d" stroke-width="2"/><text x="672" y="597" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">5. Quyền dữ liệu đơn hàng</text><text x="672" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">Dify và backend gọi /api/orders/my-orders bằng JWT của khách.</text><text x="672" y="653" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#122b35">JWT không đưa vào lời nhắc; backend kiểm tra lại mã đơn và quyền sở hữu.</text><text x="40" y="44" text-anchor="start" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#122b35">Năm lớp kiểm soát dữ liệu của trợ lý Mai</text><text x="312" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#122b35">Trong chatflow Dify</text><text x="1004" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#122b35">Trong backend Express</text><text x="672" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#122b35">Ví dụ: JSON có #12 → LLM trả #12 và #999 → loại #999 → chỉ hiển thị #12</text></svg></div></body></html>
