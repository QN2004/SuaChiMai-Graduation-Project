<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity — trợ lý Mai</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #fff9fb; --color-ink: #122b35; --color-muted: #64737d; --font-sans: 'Inter', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; padding: 3rem 2rem; }
    .frame { max-width: 960px; width: 100%; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.75rem; }
    .lede { font-size: 0.95rem; line-height: 1.5; color: var(--color-muted); max-width: 42rem; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Activity · Trợ lý Mai</p>
    <h1>Trả lời câu hỏi và tra cứu đơn</h1>
    <p class="lede">Khách gửi câu hỏi hoặc ảnh. Mai nhận diện nhu cầu, từ chối câu hỏi ngoài cửa hàng, rồi tìm trong sản phẩm, tài liệu hoặc đơn. Tra cứu đơn chỉ hiện đơn của đúng tài khoản đang đăng nhập.</p>
    <div class="diagram-container">
      <svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="activity-tro-ly-title activity-tro-ly-desc">
        <title id="activity-tro-ly-title">Activity trợ lý Mai</title>
        <desc id="activity-tro-ly-desc">Mai nhận câu hỏi hoặc ảnh, từ chối nội dung ngoài phạm vi, tìm dữ liệu cửa hàng, và chỉ trả đơn hàng khi khách đã đăng nhập.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64737d"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d03169"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5f78"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#fff9fb"/>

        <line x1="360" y1="60" x2="360" y2="80" stroke="#64737d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="124" x2="360" y2="144" stroke="#64737d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="188" x2="360" y2="208" stroke="#64737d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="288" x2="360" y2="324" stroke="#64737d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="450" y1="248" x2="560" y2="248" stroke="#64737d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="372" x2="360" y2="392" stroke="#64737d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="472" x2="360" y2="508" stroke="#d03169" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="450" y1="432" x2="560" y2="432" stroke="#64737d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="556" x2="360" y2="576" stroke="#64737d" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="368" y="298" width="28" height="12" rx="2" fill="#fff9fb"/>
        <text x="382" y="307" fill="#5c737d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>
        <rect x="476" y="228" width="52" height="12" rx="2" fill="#fff9fb"/>
        <text x="502" y="237" fill="#5c737d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>
        <rect x="368" y="482" width="28" height="12" rx="2" fill="#fff9fb"/>
        <text x="382" y="491" fill="#d03169" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>
        <rect x="476" y="412" width="52" height="12" rx="2" fill="#fff9fb"/>
        <text x="502" y="421" fill="#5c737d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

        <rect x="240" y="24" width="240" height="36" rx="18" fill="#fff9fb"/>
        <rect x="240" y="24" width="240" height="36" rx="18" fill="rgba(18,43,53,0.03)" stroke="rgba(18,43,53,0.30)" stroke-width="1"/>
        <text x="360" y="46" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Khách mở Mai</text>
        <rect x="240" y="80" width="240" height="44" rx="6" fill="#fff9fb"/>
        <rect x="240" y="80" width="240" height="44" rx="6" fill="#ffffff" stroke="#122b35" stroke-width="1"/>
        <text x="360" y="106" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Nhập câu hỏi hoặc gửi ảnh</text>
        <rect x="240" y="144" width="240" height="44" rx="6" fill="#fff9fb"/>
        <rect x="240" y="144" width="240" height="44" rx="6" fill="#ffffff" stroke="#122b35" stroke-width="1"/>
        <text x="360" y="170" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Nhận diện nội dung</text>
        <polygon points="360,208 450,248 360,288 270,248" fill="#ffffff" stroke="#122b35" stroke-width="1"/>
        <text x="360" y="244" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Trong phạm vi</text>
        <text x="360" y="260" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">cửa hàng?</text>
        <rect x="560" y="226" width="240" height="44" rx="18" fill="#fff9fb"/>
        <rect x="560" y="226" width="240" height="44" rx="18" fill="rgba(18,43,53,0.03)" stroke="rgba(18,43,53,0.30)" stroke-width="1"/>
        <text x="680" y="252" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Từ chối, gợi ý câu hỏi</text>
        <rect x="240" y="324" width="240" height="48" rx="6" fill="#fff9fb"/>
        <rect x="240" y="324" width="240" height="48" rx="6" fill="#ffffff" stroke="#122b35" stroke-width="1"/>
        <text x="360" y="344" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Tìm sản phẩm, tài liệu</text>
        <text x="360" y="360" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">hoặc đơn hàng</text>
        <polygon points="360,392 450,432 360,472 270,432" fill="#ffffff" stroke="#122b35" stroke-width="1"/>
        <text x="360" y="428" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Đủ quyền</text>
        <text x="360" y="444" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">trả lời?</text>
        <rect x="560" y="410" width="240" height="44" rx="18" fill="#fff9fb"/>
        <rect x="560" y="410" width="240" height="44" rx="18" fill="rgba(18,43,53,0.03)" stroke="rgba(18,43,53,0.30)" stroke-width="1"/>
        <text x="680" y="436" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Yêu cầu đăng nhập</text>
        <rect x="240" y="508" width="240" height="48" rx="6" fill="#fff9fb"/>
        <rect x="240" y="508" width="240" height="48" rx="6" fill="rgba(208,49,105,0.08)" stroke="#d03169" stroke-width="1.2"/>
        <text x="360" y="528" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Trả lời, hiện sản phẩm,</text>
        <text x="360" y="544" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">so sánh hoặc đơn</text>
        <rect x="240" y="576" width="240" height="36" rx="18" fill="#fff9fb"/>
        <rect x="240" y="576" width="240" height="36" rx="18" fill="rgba(18,43,53,0.03)" stroke="rgba(18,43,53,0.30)" stroke-width="1"/>
        <text x="360" y="598" fill="#122b35" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Khách hỏi tiếp</text>

        <line x1="40" y1="680" x2="920" y2="680" stroke="rgba(18,43,53,0.10)" stroke-width="0.8"/>
        <text x="40" y="704" fill="#64737d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="140" y="694" width="22" height="10" rx="5" fill="rgba(18,43,53,0.03)" stroke="rgba(18,43,53,0.30)" stroke-width="1"/>
        <text x="170" y="703" fill="#64737d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">START / END</text>
        <rect x="320" y="694" width="18" height="10" rx="2" fill="#ffffff" stroke="#122b35" stroke-width="1"/>
        <text x="346" y="703" fill="#64737d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">STEP</text>
        <polygon points="440,699 448,694 456,699 448,704" fill="#ffffff" stroke="#122b35" stroke-width="1"/>
        <text x="464" y="703" fill="#64737d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">DECISION</text>
        <line x1="600" y1="699" x2="628" y2="699" stroke="#d03169" stroke-width="1.2"/>
        <text x="636" y="703" fill="#64737d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">HAPPY PATH</text>
      </svg>
    </div>
  </div>
</body>
</html>
