name: suachimai

include:
  - path: ./dify/docker-compose.yaml

services:
  mysql:
    image: mysql:8.0
    container_name: suachimai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: milk_store
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    image: mysql:8.0
    container_name: suachimai-db-init
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: milk_store
      SQL_DIR: /sql
    volumes:
      - ./database:/sql:ro
    entrypoint: ["bash", "/sql/docker-init.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
    image: suachimai-backend:local
    container_name: suachimai-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: milk_store
      DB_PORT: 3306
      JWT_SECRET: milk_store_secret_key
      CLIENT_URL: ${FRONTEND_URL:-http://localhost:3000}
      CLIENT_URLS: ${FRONTEND_URL:-http://localhost:3000}
      DIFY_API_URL: ${DIFY_API_URL:-http://nginx/v1}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_TIMEOUT_MS: ${DIFY_TIMEOUT_MS:-120000}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${EXPOSE_BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend/src/uploads:/app/src/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-init:
        condition: service_completed_successfully
      nginx:
        condition: service_started

  # Upstream Dify gates these behind profiles. This project always starts them.
  db_postgres:
    profiles: !override []
  weaviate:
    profiles: !override []
  api_websocket:
    profiles: !override []

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    image: suachimai-frontend:local
    container_name: suachimai-frontend
    restart: unless-stopped
    ports:
      - "${EXPOSE_FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  updater:
    build:
      context: ./updater
    image: suachimai-updater:local
    container_name: suachimai-updater
    working_dir: /workspace
    environment:
      HOST_PROJECT_DIR: D:/DO-AN/SuaChiMai-Graduation-Project
      COMPOSE_PROJECT_NAME: suachimai
    volumes:
      - D:/DO-AN/SuaChiMai-Graduation-Project:/workspace
      - //var/run/docker.sock:/var/run/docker.sock
    depends_on:
      frontend:
        condition: service_started
    restart: "no"
    profiles:
      - tools

volumes:
  mysql_data:
